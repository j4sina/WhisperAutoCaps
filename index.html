<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WhisperAuto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">
    <div class="container">
        
        <div class="header">
            <div class="logo-container">
                <div class="logo-icon">W</div>
                <h1>WhisperAuto</h1>
            </div>
            <p class="subtitle">AI Subtitle Generator</p>
        </div>

        <div class="controls-card">
            <div class="input-group">
                <label for="modelSelect">Whisper Model</label>
                <select id="modelSelect" class="custom-select">
                    <option value="tiny">Tiny (Fastest, low accuracy)</option>
                    <option value="base" selected>Base (Fast, good accuracy)</option>
                    <option value="small">Small (Slower, better accuracy)</option>
                    <option value="medium">Medium (Slow, high accuracy)</option>
                    <option value="large">Large (Very slow, best accuracy)</option>
                    <option value="large-v2">Large v2 (Very slow, refined)</option>
                    <option value="turbo">Turbo (Fast + high accuracy)</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="languageSelect">Language</label>
                <select id="languageSelect" class="custom-select">
                    <option value="pl" selected>Polish</option>
                    <option value="en">English</option>
                    <option value="">Auto-Detect</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="presetPath">Audio Export Preset (.epr)</label>
                <div class="file-input-wrapper">
                    <input type="text" id="presetPath" placeholder="Click to select preset..." readonly>
                    <button id="browsePresetBtn" class="icon-btn">📁</button>
                </div>
            </div>
        </div>

        <div class="controls-card">
            <h3 class="card-title">Subtitle Formatting</h3>
            <div class="input-group">
                <label for="maxWordsInput">Max Words per Line (0 for auto)</label>
                <input type="number" id="maxWordsInput" class="custom-input" min="0" max="20" value="5">
            </div>
            
            <div class="checkbox-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="highlightCheckbox" checked>
                    <span class="checkmark"></span>
                    Karaoke Word Highlighting
                </label>
            </div>
            
            <div class="input-group" id="colorPickerGroup">
                <label for="highlightColor">Highlight Color</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="highlightColor" class="custom-color-picker" value="#ffff00">
                    <span id="colorHex" class="color-hex-text">#ffff00</span>
                </div>
            </div>
        </div>

        <button id="transcribeBtn" class="primary-btn">
            <span class="btn-text">Transcribe Sequence</span>
            <div class="loader" id="btnLoader"></div>
        </button>

        <div id="statusContainer" class="status-container hidden">
            <div class="progress-track">
                <div id="progressBar" class="progress-fill"></div>
            </div>
            <p id="statusText" class="status-text">Ready...</p>
        </div>
        
        <div id="errorContainer" class="error-container hidden">
            <p id="errorText"></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/CSInterface.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
